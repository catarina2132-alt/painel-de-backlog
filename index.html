<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Backlog</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --card2:#f3f6fa;
    --border:#d7e2f2;
    --detran-blue:#0b3d91;
    --detran-blue-dark:#082a66;
    --cyan:#0b3d91;
    --teal:#3b78c4;
    --white:#1f2937;
    --gray:#5b6b7c;
    --gray-dark:#8a97a6;
    --enabler-bg:#e3ecfa; --enabler-tx:#0b3d91;
    --split-bg:#f1e9fb;  --split-tx:#6d28d9;
    --ritm-bg:#fef9c3;   --ritm-tx:#713f12;
    --debt-bg:#fee2e2;   --debt-tx:#b91c1c;
    --ok-bg:#f8fafc;     --ok-tx:#94a3b8;
    --warn-bg:#fef3c7;   --warn-tx:#92400e;
    --icon-blue-bg:#e3ecfa;   --icon-blue-tx:#0b3d91;
    --icon-green-bg:#dcfce7;  --icon-green-tx:#16a34a;
    --icon-amber-bg:#fef3c7;  --icon-amber-tx:#d97706;
    --icon-purple-bg:#f1e9fb; --icon-purple-tx:#7c3aed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:Calibri,Arial,sans-serif;
    padding:0 0 60px; /* Ajustado para a barra superior */
  }
  
  /* --- ESTILOS DA BARRA DE LOGIN --- */
  .auth-bar {
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
    padding: 12px 40px; background: #ffffff; border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .auth-bar input {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; 
    font-size: 13px; background: var(--card2); color: var(--white); outline: none;
  }
  .auth-bar input:focus { border-color: var(--cyan); }
  .auth-bar button {
    padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; 
    cursor: pointer; font-size: 13px; transition: 0.2s;
  }
  .auth-bar .btn-login { background: var(--detran-blue); color: #ffffff; }
  .auth-bar .btn-login:hover { background: var(--detran-blue-dark); }
  .auth-bar .btn-logout { background: transparent; border: 1px solid var(--debt-tx); color: var(--debt-tx); }
  .auth-bar .btn-logout:hover { background: var(--debt-bg); }
  .user-info { font-size: 13px; color: var(--gray); font-weight: bold; }
  /* --------------------------------- */

  .main-content { padding: 0 40px; }
  
  /* Estilos Originais do Cabeçalho e Tabela */
  .header-bar{
    background: linear-gradient(135deg, var(--detran-blue) 0%, var(--detran-blue-dark) 100%);
    padding:18px 28px; border-radius:12px; margin-bottom:22px;
  }
  .header-top-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .detran-logo-box{
    background:#ffffff; border-radius:8px; padding:8px 14px;
    display:flex; align-items:center; justify-content:center;
  }
  .detran-logo-img{ height:26px; width:auto; display:block; }
  .header-divider{ width:1px; align-self:stretch; background:rgba(255,255,255,0.25); }
  .header-titles{ display:flex; flex-direction:column; gap:4px; justify-content:center; }
  .eyebrow{
    display:inline-block; width:fit-content; border:1px solid rgba(255,255,255,0.5); color:#ffffff;
    background:rgba(255,255,255,0.08);
    font-size:11px; font-weight:bold; letter-spacing:1px;
    padding:5px 14px; border-radius:20px;
  }
  h1{ font-size:24px; margin:0; color:#ffffff; }
  h1 span{color:#bcd4f5;}
  .subtitle-inline{ color:#cfe0f7; font-size:12.5px; max-width:520px; margin-top:8px; }
  
  .table-wrap{ overflow-x:auto; border-radius:10px; margin-top:20px;}
  table{
    width:100%; min-width:1420px; border-collapse:collapse; background:var(--card);
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
  }
  thead th{
    text-align:left; font-size:11px; letter-spacing:0.5px; color:#ffffff;
    background:var(--detran-blue); padding:12px 10px; font-weight:bold;
  }
  tbody td{
    padding:8px 10px; border-top:1px solid var(--border); font-size:13px; vertical-align:middle;
  }
  .footer-note{color:var(--gray-dark); font-size:11.5px; margin-top:14px; text-align:center;}
</style>
</head>
<body>

      <button id="loginBtn" class="btn-login">Entrar</button>
    </div>
    <div id="userSection" style="display: none; align-items: center; gap: 12px;">

      <button id="logoutBtn" class="btn-logout">Sair do Painel</button>
    </div>

        <div class="header-titles">
          <div class="eyebrow">GESTÃO DE SPRINTS</div>

      </div>
      <div class="subtitle-inline">Planeje e acompanhe Sustentações, Melhorias e Demandas da Sprint.</div>
    </div>

    <!-- Tabela principal -->
    <div class="table-wrap">
      <table>
        <thead id="tableHead">
          <tr>
            <th>Nº</th>
            <th>ID</th>
            <th>Backlog Técnico</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Status</th>
            <th>Sprint</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- A tabela será populada aqui pelo Firebase ou LocalStorage -->
        </tbody>
      </table>
    </div>
    
    <div class="footer-note">Gestão de Sprints © 2026 | Painel de Controle do Backlog | Sincronizado via Firebase</div>
  </div>

<script type="module">
  // ==========================================
  // CONFIGURAÇÃO DO FIREBASE (LÓGICA DE LOGIN)
  // ==========================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  // ⚠️ SUBSTITUA AS INFORMAÇÕES ABAIXO PELAS SUAS CHAVES DO FIREBASE ⚠️
  const firebaseConfig = {
    apiKey: "COLOQUE_AQUI_A_SUA_API_KEY",
    authDomain: "COLOQUE_AQUI_O_SEU_AUTH_DOMAIN",
    projectId: "COLOQUE_AQUI_O_SEU_PROJECT_ID",
    storageBucket: "COLOQUE_AQUI_O_SEU_STORAGE_BUCKET",
    messagingSenderId: "COLOQUE_AQUI_O_SEU_MESSAGING_SENDER_ID",
    appId: "COLOQUE_AQUI_O_SEU_APP_ID"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Elementos de Autenticação na Tela
  const loginSection = document.getElementById('loginSection');
  const userSection = document.getElementById('userSection');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmail = document.getElementById('userEmail');
  const tableBody = document.getElementById('tableBody');

  // Monitorar Estado de Autenticação (Verifica se está logado)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // O utilizador tem a sessão iniciada! Mostrar email e esconder senha
      loginSection.style.display = 'none';
      userSection.style.display = 'flex';
      userEmail.textContent = `🟢 Conectado como: ${user.email}`;
      tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">A carregar dados da tabela...</td></tr>';
      
      // (Aqui entraria a sua função original de renderizar a tabela/buscar da base de dados)
      
    } else {
      // O utilizador NÃO está com a sessão iniciada. Pedir senha.
      loginSection.style.display = 'flex';
      userSection.style.display = 'none';
      emailInput.value = '';
      passwordInput.value = '';
      tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#b91c1c; font-weight:bold;">Faça login acima para visualizar e editar o backlog.</td></tr>';
    }
  });

  // Ação do Botão de Login
  loginBtn.addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;
    
    if(email && password) {
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          // O login foi um sucesso (o onAuthStateChanged acima será disparado automaticamente)
        })
        .catch((error) => {
          alert('Erro ao entrar. Verifique o e-mail ou a palavra-passe.');
          console.error(error);
        });
    } else {
      alert('Por favor, preencha o E-mail e a Palavra-passe.');
    }
  });

  // Ação do Botão de Logout (Sair)
  logoutBtn.addEventListener('click', () => {
    signOut(auth).catch((error) => {
      alert('Ocorreu um erro ao sair da conta.');
    });
  });

</script>
